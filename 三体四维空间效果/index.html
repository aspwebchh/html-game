<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>四维碎片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;500;900&display=swap">
<style>
/* Layout: full-bleed observation canvas; chapter title set vertically on the left edge, narration low-left, transport dock along the bottom, instrument panel on the right. */
:root {
  --void: #05060d;
  --void-0: rgba(5, 6, 13, 0);
  --hull: #0b0e1c;
  --ink: #e4e8f6;
  --dim: #858ca8;
  --line: rgba(150, 160, 205, 0.22);
  --glass: rgba(9, 11, 22, 0.66);
  --sel: rgba(207, 200, 255, 0.14);
  --w-neg: #3fd6ff;
  --w-zero: #cfc8ff;
  --w-pos: #ff52b9;
  --gold: #ffc96b;
  --font-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  --gutter: clamp(16px, 3vw, 40px);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--void); color: var(--ink);
  font-family: var(--font-body); font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
:focus-visible { outline: 1px solid var(--w-zero); outline-offset: 3px; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }

.brand { position: fixed; top: 0; left: 0; padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--gutter) 0; pointer-events: none; }
.brand h1 { margin: 0; font: 500 1.05rem/1.2 var(--font-display); letter-spacing: .32em; }
.brand p { margin: .4rem 0 0; font-size: .75rem; color: var(--dim); letter-spacing: .08em; }

#chapter {
  position: fixed; left: var(--gutter); top: 50%; transform: translateY(-50%);
  margin: 0; display: flex; gap: .7rem; writing-mode: vertical-rl; pointer-events: none;
}
#chNum { font: 300 .95rem/1 var(--font-display); color: var(--dim); letter-spacing: .3em; }
#chTitle { margin: 0; font: 900 clamp(2rem, 1.1rem + 2.4vw, 3.4rem)/1 var(--font-display); letter-spacing: .22em; text-wrap: balance; }

#legend { position: fixed; top: 0; right: 0; padding: calc(env(safe-area-inset-top, 0px) + 20px) var(--gutter) 0; pointer-events: none; }
#legend > div { width: 184px; font: 400 .7rem/1.3 var(--font-mono); color: var(--dim); }
#legend .bar { position: relative; height: 5px; margin: .5rem 0 .35rem; border-radius: 3px; background: linear-gradient(90deg, var(--w-neg), var(--w-zero), var(--w-pos)); }
#legendMark { position: absolute; top: -4px; left: 50%; width: 2px; height: 13px; margin-left: -1px; background: var(--ink); }
#legend .ticks { display: flex; justify-content: space-between; }

#bottom {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 0 var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column; gap: 14px; pointer-events: none;
}
#captions {
  position: relative; max-width: 36em; min-height: 5.6em; pointer-events: none;
  font: 400 clamp(1rem, .92rem + .4vw, 1.28rem)/1.85 var(--font-display);
  text-shadow: 0 0 16px var(--void), 0 0 4px var(--void);
}
.cap { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; text-wrap: pretty; }
.cap.in { animation: capIn .9s cubic-bezier(.2, .7, .2, 1) both; }
.cap.out { animation: capOut .7s ease both; }
@keyframes capIn { from { opacity: 0; transform: translateY(8px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes capOut { to { opacity: 0; transform: translateY(-6px); } }

#dock { display: flex; align-items: center; gap: clamp(10px, 2vw, 22px); pointer-events: auto; }
.ctrls { display: flex; gap: 8px; }
.ib {
  width: 38px; height: 38px; padding: 0; display: grid; place-items: center; cursor: pointer;
  border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--ink);
}
.ib:hover { border-color: var(--w-zero); }
.ib svg { width: 16px; height: 16px; fill: currentColor; }
#timeline { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.seg { width: 100%; padding: 10px 0 2px; display: grid; gap: 7px; background: none; border: 0; cursor: pointer; color: var(--dim); text-align: left; }
.seg .bar { position: relative; display: block; height: 2px; overflow: hidden; background: var(--line); }
.seg .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--ink); }
.seg-name { font: 400 .72rem/1.2 var(--font-body); letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg[aria-current="step"] { color: var(--ink); }
.seg:hover { color: var(--ink); }
.hint { font: 400 .68rem var(--font-mono); color: var(--dim); white-space: nowrap; }

#panel {
  position: fixed; right: var(--gutter); top: 50%; transform: translateY(-50%);
  width: 252px; padding: 16px; pointer-events: auto;
  background: var(--glass); border: 1px solid var(--line); border-radius: 6px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.pg { display: grid; gap: 10px; }
.pg-h { margin: 0; font: 400 .7rem var(--font-mono); letter-spacing: .14em; color: var(--dim); }
.pg-note { margin: 0; font-size: .78rem; line-height: 1.65; color: var(--dim); }
.toggle, .chip {
  padding: .55em .9em; cursor: pointer; color: var(--ink);
  font: 500 .85rem var(--font-body); background: transparent;
  border: 1px solid var(--line); border-radius: 4px;
}
.toggle[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--sel); border-color: var(--w-zero); }
.chips { display: flex; gap: 8px; }
.chip { flex: 1; font-family: var(--font-mono); letter-spacing: .06em; }
.pg label { display: flex; justify-content: space-between; align-items: baseline; font-size: .8rem; color: var(--dim); }
.pg output, .mono { font: 400 .78rem var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; margin: 0; accent-color: var(--w-zero); }
#mini { display: block; width: 100%; height: 118px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

@media (max-width: 1100px) { .hint { display: none; } }
@media (max-width: 760px) {
  .brand p { display: none; }
  #chapter { top: calc(env(safe-area-inset-top, 0px) + 50px); transform: none; writing-mode: horizontal-tb; align-items: baseline; gap: .6rem; }
  #chTitle { font-size: 1.45rem; letter-spacing: .12em; }
  #chNum { font-size: .8rem; letter-spacing: .15em; }
  #legend > div { width: 116px; }
  #bottom { padding-top: 30px; gap: 12px; background: linear-gradient(to top, var(--void) 72%, var(--void-0)); }
  #captions { font-size: .98rem; line-height: 1.75; min-height: 5.3em; }
  #panel { position: static; transform: none; width: auto; padding: 12px; }
  .pg { gap: 8px; }
  .pg-note { display: none; }
  #mini { height: 92px; }
  .seg-name { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .cap.in, .cap.out { animation-duration: .01s; }
}
</style>

<canvas id="stage" aria-label="四维空间动画画布"></canvas>

<header class="brand">
  <h1>四维碎片</h1>
  <p>《三体 III · 死神永生》中的四维空间</p>
</header>

<header id="chapter">
  <span id="chNum">序章</span>
  <h2 id="chTitle">十维的往昔</h2>
</header>

<aside id="legend" hidden>
  <div>
    <span>颜色 = 第四维坐标 w</span>
    <div class="bar"><span id="legendMark" hidden></span></div>
    <div class="ticks"><span>w −</span><span>0</span><span>w +</span></div>
  </div>
</aside>

<div id="bottom">
  <div id="captions" aria-live="polite"></div>

  <aside id="panel" aria-label="交互控制" hidden>
    <div class="pg" data-ch="3" hidden>
      <p class="pg-h">观察方式</p>
      <button id="btnVision" class="toggle" type="button" aria-pressed="false">四维视觉 · 关</button>
      <p class="pg-note">关闭时只能看见外壳。打开后，物体的全部截面同时铺开，内部没有遮挡。</p>
    </div>
    <div class="pg" data-ch="4" hidden>
      <p class="pg-h">四维旋转平面</p>
      <div class="chips">
        <button id="rotXW" class="chip" type="button" aria-pressed="true">XW</button>
        <button id="rotYW" class="chip" type="button" aria-pressed="true">YW</button>
        <button id="rotZW" class="chip" type="button" aria-pressed="false">ZW</button>
      </div>
      <label for="tessSpeed">转速 <output id="tessSpeedOut">1.0×</output></label>
      <input id="tessSpeed" type="range" min="0" max="2" step="0.05" value="1">
      <p class="pg-note">在含 w 的平面里旋转，三维投影就会出现内外翻转。</p>
    </div>
    <div class="pg" data-ch="5" hidden>
      <p class="pg-h">(x, w) 剖面</p>
      <canvas id="mini" aria-label="四维物体在 x-w 平面上的剖面与切面位置"></canvas>
      <label for="ringW">切面位置 <output id="ringWOut">w = −0.75</output></label>
      <input id="ringW" type="range" min="-1.15" max="1.15" step="0.01" value="-0.75">
      <div class="row">
        <button id="ringAuto" class="toggle" type="button" aria-pressed="true">自动扫描</button>
        <span id="ringRho" class="mono">ρ = 0.66</span>
      </div>
      <p class="pg-note">截面是一个环面，管径 ρ = √(1 − w²)。|w| ≥ 1 时截面为空。</p>
    </div>
  </aside>

  <nav id="dock" aria-label="章节">
    <div class="ctrls">
      <button id="btnPrev" class="ib" type="button" aria-label="上一章"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="btnPlay" class="ib" type="button" aria-label="暂停"></button>
      <button id="btnNext" class="ib" type="button" aria-label="下一章"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 5H18v14h-2.4zM4 5l10.5 7L4 19z"/></svg></button>
    </div>
    <ol id="timeline"></ol>
    <span class="hint">拖动画面旋转视角 · ← → 切换章节 · 空格暂停</span>
  </nav>
</div>

<script>
(() => {
'use strict';

/* ---------- math ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const rng = seed => () => {
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const fib = (n, i) => { const y = 1 - ((i + 0.5) / n) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653; return [Math.cos(th) * r, y, Math.sin(th) * r]; };
const fmt = n => (n < 0 ? '−' : '+') + Math.abs(n).toFixed(2);
function rot(p, i, j, a) { const c = Math.cos(a), s = Math.sin(a), u = p[i], v = p[j]; p[i] = u * c - v * s; p[j] = u * s + v * c; }
function hull(pts) {
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}

const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const MOTION = REDUCED ? 0.35 : 1;
const $ = s => document.querySelector(s);

/* ---------- tokens → canvas colors ---------- */
const rs = getComputedStyle(document.documentElement);
const hex = (name, fb) => { let h = (rs.getPropertyValue(name).trim() || fb).replace('#', ''); if (h.length === 3) h = h.replace(/./g, c => c + c); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const C = {
  void: hex('--void', '#05060d'), hull: hex('--hull', '#0b0e1c'), ink: hex('--ink', '#e4e8f6'), dim: hex('--dim', '#858ca8'),
  neg: hex('--w-neg', '#3fd6ff'), zero: hex('--w-zero', '#cfc8ff'), pos: hex('--w-pos', '#ff52b9'), gold: hex('--gold', '#ffc96b'),
};
const FONT = { display: rs.getPropertyValue('--font-display').trim() || 'serif', mono: rs.getPropertyValue('--font-mono').trim() || 'monospace' };
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const BG = rgba(C.void, 1);

// w ramp: negative w → cyan, w = 0 → pale violet (our 3D slice), positive w → magenta
const RAMP_N = 64, RAMP = [];
for (let i = 0; i <= RAMP_N; i++) {
  const t = (i / RAMP_N) * 2 - 1, end = t < 0 ? C.neg : C.pos, k = Math.pow(Math.abs(t), 0.8);
  RAMP.push(C.zero.map((z, j) => Math.round(lerp(z, end[j], k))));
}
const ri = w => clamp(Math.round(((w + 1) / 2) * RAMP_N), 0, RAMP_N);
const wc = (w, a) => rgba(RAMP[ri(w)], a);

function sprite(c) {
  const s = 64, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d'), core = c.map(v => Math.round(v + (255 - v) * 0.75));
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, rgba(core, 1)); gr.addColorStop(0.1, rgba(c, 1)); gr.addColorStop(0.3, rgba(c, 0.32));
  gr.addColorStop(0.62, rgba(c, 0.07)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return cv;
}
const SPR = RAMP.map(sprite), SPR_INK = sprite(C.ink), SPR_GOLD = sprite(C.gold);

/* ---------- canvas & layout ---------- */
const cv = $('#stage'), ctx = cv.getContext('2d');
const elPanel = $('#panel');
let W = 1, H = 1, DPR = 1, S = 600, CX = 0, CY = 0, tS = 600, tCX = 0, tCY = 0, AW = 600, gt = 0;

function measure() {
  const mobile = W < 760, chR = $('#chapter').getBoundingClientRect();
  let top, bot, left, right;
  if (mobile) {
    top = chR.bottom + 6; bot = $('#bottom').getBoundingClientRect().top + 26; left = 0; right = W;
  } else {
    top = 64; bot = $('#dock').getBoundingClientRect().top - 8; left = chR.right + 8;
    right = elPanel.hidden ? W - left : elPanel.getBoundingClientRect().left - 8;
  }
  tCX = (left + right) / 2; tCY = (top + bot) / 2; AW = right - left;
  tS = Math.max(180, Math.min((right - left) * 0.98, (bot - top) * 1.02));
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  measure(); S = tS; CX = tCX; CY = tCY; sizeMini();
}

/* ---------- 3D camera ---------- */
const cam = { yaw: 0, pitch: 0.3, dist: 6, fov: 1.38, tx: 0, ty: 0, tz: 0, uy: 0, up: 0, uyT: 0, upT: 0 };
let cY = 1, sY = 0, cP = 1, sP = 0, F = 300;
const P = { x: 0, y: 0, s: 0, d: 1 }, V = [0, 0, 0];
function camPrep() {
  const yw = cam.yaw + cam.uy, pt = clamp(cam.pitch + cam.up, -1.45, 1.45);
  cY = Math.cos(yw); sY = Math.sin(yw); cP = Math.cos(pt); sP = Math.sin(pt); F = S * 0.5 * cam.fov;
}
function view(x, y, z) {
  x -= cam.tx; y -= cam.ty; z -= cam.tz;
  const x1 = x * cY - z * sY, z1 = x * sY + z * cY;
  V[0] = x1; V[1] = y * cP + z1 * sP; V[2] = -y * sP + z1 * cP; return V;
}
function proj(x, y, z) {
  view(x, y, z); const d = V[2] + cam.dist, s = d > 0.05 ? F / d : 0;
  P.x = CX + V[0] * s; P.y = CY - V[1] * s; P.s = s; P.d = d; return P;
}
function facing(px, py, pz, nx, ny, nz) {
  view(px, py, pz); const vx = V[0], vy = V[1], vz = V[2];
  const x1 = nx * cY - nz * sY, z1 = nx * sY + nz * cY, ny2 = ny * cP + z1 * sP, nz2 = -ny * sP + z1 * cP;
  return -x1 * vx - ny2 * vy + nz2 * (-cam.dist - vz) > 0;
}

/* ---------- drawing helpers ---------- */
function dot(spr, x, y, r, a) {
  if (a <= 0.004 || r < 0.3) return;
  ctx.globalAlpha = a > 1 ? 1 : a; ctx.drawImage(spr, x - r, y - r, r * 2, r * 2);
}
function label(text, x, y, o = {}) {
  const a = clamp(o.a ?? 1, 0, 1); if (a <= 0.01) return;
  ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = a;
  ctx.font = o.font || `400 ${o.size || 12}px ${FONT.mono}`; ctx.fillStyle = o.color || rgba(C.dim, 1);
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y); ctx.restore();
}

/* ---------- starfield (shared backdrop) ---------- */
const STARS = (() => { const R = rng(3), a = []; for (let i = 0; i < 720; i++) a.push({ x: (R() * 2 - 1) * 26, y: (R() * 2 - 1) * 26, z: 0.6 + R() * 48, b: 0.35 + R() * 0.65 }); return a; })();
function stars(dt, o) {
  const speed = (o.speed ?? 0.3) * MOTION, alpha = o.alpha ?? 1, ghost = o.ghost || 0, lensR = o.lensR || 0, lensK = o.lensK || 0, rt = o.rot || 0;
  const F2 = S * 0.9, cr = Math.cos(rt), sr = Math.sin(rt), ga = gt * 0.09, gx = Math.cos(ga) * 14, gy = Math.sin(ga) * 10;
  const px0 = cam.uy * 5, py0 = -cam.up * 5;
  ctx.globalCompositeOperation = 'lighter';
  for (const s of STARS) {
    s.z -= speed * dt; if (s.z < 0.6) s.z += 48;
    const x = s.x * cr - s.y * sr + px0, y = s.x * sr + s.y * cr + py0;
    let sx = (x / s.z) * F2, sy = (y / s.z) * F2, inLens = false;
    if (lensK > 0) {
      const r = Math.hypot(sx, sy);
      if (r < lensR && r > 0.01) { const nr = lensR * Math.pow(r / lensR, 1 - 0.5 * lensK); sx *= nr / r; sy *= nr / r; inLens = true; }
    }
    const px = CX + sx, py = CY + sy;
    if (px < -60 || px > W + 60 || py < -60 || py > H + 60) continue;
    const near = 1 - s.z / 48.6, a = alpha * s.b * (0.22 + near * 0.95), r = 1.3 + near * 3.4;
    if (inLens) {
      const L = Math.hypot(sx, sy), tx = (-sy / L) * 2.4 * lensK, ty = (sx / L) * 2.4 * lensK;
      dot(SPR[0], px + tx, py + ty, r, a * 0.6); dot(SPR[RAMP_N], px - tx, py - ty, r, a * 0.6);
    }
    if (ghost > 0.01) {
      // each star opens along its own slightly different w-direction, breathing in and out
      const th = (s.b - 0.5) * 1.8, ct = Math.cos(th), st = Math.sin(th);
      const gm = ghost * (0.35 + near * 1.1) * (0.65 + 0.35 * Math.sin(gt * 0.6 + s.b * 17));
      const dx = (gx * ct - gy * st) * gm, dy = (gx * st + gy * ct) * gm;
      for (let k = -2; k <= 2; k++) { if (!k) continue; dot(SPR[ri(k / 2)], px + dx * k, py + dy * k, r * 1.2, a * ghost * (1.15 - Math.abs(k) * 0.25)); }
    }
    dot(SPR_INK, px, py, r, a);
  }
}

/* ---------- tesseract data (shared by ch4 / ch6) ---------- */
const TV = []; for (let i = 0; i < 16; i++) TV.push([i & 1 ? 1 : -1, i & 2 ? 1 : -1, i & 4 ? 1 : -1, i & 8 ? 1 : -1]);
const TE = []; for (let i = 0; i < 16; i++) for (let b = 0; b < 4; b++) { const j = i ^ (1 << b); if (j > i) TE.push([i, j]); }
function drawEdges(VS, alphaK, widthK) {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  const SEG = 6;
  for (let pass = 0; pass < 2; pass++) {
    for (const [a, b] of TE) {

  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 5h3.6v14H6.5zM13.9 5h3.6v14h-3.6z"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>',
  replay: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L7 5.5 12 10V6.5a5.5 5.5 0 1 1-5.5 5.5H4a8 8 0 1 0 8-8z"/></svg>',
};
const btnPlay = $('#btnPlay');
let cur = 0, ct = 0, playing = true, ended = false, capIdx = -1, fadeT = 9, playState = '';
function syncPlay() {
  const st = ended ? 'replay' : playing ? 'pause' : 'play';
  if (st === playState) return; playState = st;
  btnPlay.innerHTML = ICON[st];
  btnPlay.setAttribute('aria-label', st === 'replay' ? '从头重播' : st === 'pause' ? '暂停' : '播放');
}
btnPlay.addEventListener('click', () => { if (ended) go(0); else { playing = !playing; syncPlay(); } });
$('#btnPrev').addEventListener('click', () => go(cur - 1));
$('#btnNext').addEventListener('click', () => { if (cur < CH.length - 1) go(cur + 1); });

const segs = CH.map((ch, i) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.className = 'seg'; b.type = 'button'; b.setAttribute('aria-label', `${ch.num} ${ch.title}`);
  b.innerHTML = `<span class="bar"><span class="fill"></span></span><span class="seg-name">${ch.title}</span>`;
  b.addEventListener('click', () => go(i));
  li.appendChild(b); $('#timeline').appendChild(li);
  return { btn: b, fill: b.querySelector('.fill') };
});

const elCap = $('#captions');
function updateCaption(animate) {
  const L = CH[cur].lines; let idx = 0;
  for (let i = 0; i < L.length; i++) if (ct >= L[i][0]) idx = i;
  if (idx === capIdx) return; capIdx = idx;
  elCap.querySelectorAll('.cap').forEach(p => {
    if (p.classList.contains('out')) { p.remove(); return; }
    p.classList.remove('in'); p.classList.add('out'); setTimeout(() => p.remove(), 750);
  });
  const p = document.createElement('p'); p.className = 'cap' + (animate ? ' in' : ''); p.textContent = L[idx][1]; elCap.appendChild(p);
}

function renderChapter() {
  const ch = CH[cur];
  setText($('#chNum'), ch.num); setText($('#chTitle'), ch.title);
  document.querySelectorAll('.pg').forEach(g => { g.hidden = +g.dataset.ch !== cur; });
  elPanel.hidden = !ch.panel;
  $('#legend').hidden = !ch.legend; $('#legendMark').hidden = cur !== 5;
  segs.forEach((s, i) => { s.fill.style.width = i < cur ? '100%' : '0%'; if (i === cur) s.btn.setAttribute('aria-current', 'step'); else s.btn.removeAttribute('aria-current'); });
  requestAnimationFrame(() => { measure(); sizeMini(); });
}
function go(i) {
  cur = clamp(i, 0, CH.length - 1); ct = 0; ended = false; playing = true; fadeT = 0; capIdx = -1;
  cam.uyT = cam.upT = 0; cam.tx = cam.ty = cam.tz = 0; ui.vision = null;
  if (CH[cur].enter) CH[cur].enter();
  renderChapter(); syncPlay();
}

addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT') return;
  if (e.key === 'ArrowRight') { if (cur < CH.length - 1) go(cur + 1); }
  else if (e.key === 'ArrowLeft') go(cur - 1);
  else if (e.key === ' ' && tag !== 'BUTTON') { e.preventDefault(); btnPlay.click(); }
});

let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (_) { /* optional */ } });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  cam.uyT += (e.clientX - drag.x) * 0.006; cam.upT = clamp(cam.upT + (e.clientY - drag.y) * 0.004, -0.9, 0.9);
  drag.x = e.clientX; drag.y = e.clientY;
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('dblclick', () => { cam.uyT = cam.upT = 0; });
addEventListener('resize', resize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

/* ---------- main loop ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now; gt += dt; fadeT += dt;
  if (playing) {
    ct += dt;
    if (ct >= CH[cur].dur) {
      if (cur < CH.length - 1) go(cur + 1);
      else { ct = CH[cur].dur; playing = false; ended = true; syncPlay(); }
    }
  }
  const k = Math.min(1, dt * 4);
  S += (tS - S) * k; CX += (tCX - CX) * k; CY += (tCY - CY) * k;
  const kc = Math.min(1, dt * 7);
  cam.uy += (cam.uyT - cam.uy) * kc; cam.up += (cam.upT - cam.up) * kc;

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  CH[cur].frame(ct, dt);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (fadeT < 0.9) { ctx.globalAlpha = 1 - smooth(0, 0.9, fadeT); ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  updateCaption(true);
  segs[cur].fill.style.width = `${Math.min(100, (ct / CH[cur].dur) * 100).toFixed(2)}%`;
  requestAnimationFrame(loop);
}

renderChapter(); syncPlay(); CH[0].enter(); updateCaption(false); resize();
// deep link: #ch3 opens chapter 3, #ch3-20 also skips 20 seconds into it
const deep = /^#ch(\d)(?:-(\d+))?$/.exec(location.hash);
if (deep) { go(+deep[1]); ct = Math.min(+(deep[2] || 0), CH[cur].dur - 1); fadeT = 9; updateCaption(false); }
requestAnimationFrame(loop);
})();
</script>
